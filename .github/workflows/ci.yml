name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Verify package contents exclude tests
        run: |
          pack_output=$(npm pack --dry-run -w @skeems/types -w @skeems/directus -w @skeems/pocketbase -w @skeems/nocodb -w @skeems/strapi -w @skeems/wikidata -w @skeems/musicbrainz -w @skeems/osm -w @skeems/openlibrary -w @skeems/crossref -w skeem 2>&1)
          echo "$pack_output"
          if echo "$pack_output" | grep -E '\.test\.'; then
            echo "::error::npm pack output contains test artifacts"
            exit 1
          fi
